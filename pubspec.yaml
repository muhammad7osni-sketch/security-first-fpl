name: squadiq
description: >
  SquadIQ — AI Fantasy Football Command Center.
  Decision-copilot app for FPL managers (read-only vs. official FPL,
  see /docs/PROJECT_PLAN section 0 for the legal rationale).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management (section 8)
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  dio: ^5.4.3

  # Serialization
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Backend
  supabase_flutter: ^2.5.6

  # Local cache / offline (section 8)
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.3
  path: ^1.9.0

  # Secure storage — tokens only, never raw FPL session cookies (section 0/18)
  flutter_secure_storage: ^9.2.2

  # Local scheduled notifications (deadline reminders) - no backend
  # required, unlike firebase_messaging below which needs a server to
  # trigger a push.
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Push notifications
  firebase_messaging: ^15.0.3

  # Monitoring / analytics
  sentry_flutter: ^8.5.0
  posthog_flutter: ^4.4.0

  cupertino_icons: ^1.0.8

  # Typography for the design system (see core/theme/) - Barlow Condensed
  # for scoreboard-style display numerals, Inter for body/data text.
  google_fonts: ^6.2.1

  # URL launching — deep links to official FPL website for safe write
  # operations (section 0: read-only architecture, writes redirect to FPL)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
